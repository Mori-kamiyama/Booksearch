<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tag Camera Lab</title>
    <style>
      :root {
        --accent: #1f7a5c;
        --line: #d9e1e7;
        --text: #17212b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #f6f7f9;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(1120px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      h1 { margin: 0; font-size: 30px; }
      .sub { margin: 4px 0 0; color: #63707b; }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 16px;
      }
      section {
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .pad { padding: 16px; }
      .videoWrap {
        position: relative;
        background: #050607;
        aspect-ratio: 16 / 9;
      }
      video, canvas.preview {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .overlay {
        position: absolute;
        inset: 12%;
        border: 3px solid rgba(255,255,255,.7);
        border-radius: 12px;
        pointer-events: none;
      }
      .controls, .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      button, label.file {
        border: 1px solid #cbd5dd;
        border-radius: 6px;
        background: white;
        color: #26323d;
        height: 38px;
        padding: 0 12px;
        font-weight: 800;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
      }
      button:disabled { opacity: .45; cursor: default; }
      input[type=file] { display: none; }
      .status {
        color: #5c6872;
        font-size: 14px;
        line-height: 1.55;
      }
      .result {
        border-top: 1px solid #edf1f4;
        padding: 16px;
      }
      .result h2 {
        margin: 0 0 10px;
        font-size: 18px;
      }
      .tag {
        border: 1px solid #bee3d2;
        background: #eff8f4;
        border-radius: 8px;
        padding: 12px;
        margin-top: 10px;
      }
      .tag strong {
        color: var(--accent);
        font-size: 26px;
      }
      .quadrants {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .quadrants div {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        background: white;
        min-height: 64px;
      }
      .quadrants span {
        display: block;
        color: #7b8791;
        font-size: 12px;
        font-weight: 800;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #101820;
        color: #d5f4e6;
        border-radius: 8px;
        padding: 12px;
        max-height: 320px;
        overflow: auto;
        font-size: 12px;
      }
      a { color: var(--accent); font-weight: 800; }
      @media (max-width: 860px) {
        header, .grid { display: grid; grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Tag Camera Lab</h1>
          <p class="sub">カメラ認識だけを切り分けた最小テスト</p>
        </div>
        <a href="/test-tag.png" target="_blank" rel="noreferrer">test tag 0</a>
      </header>

      <div class="grid">
        <section>
          <div class="videoWrap">
            <video id="video" muted playsinline></video>
            <div class="overlay"></div>
          </div>
          <div class="pad">
            <div class="controls">
              <button id="start" class="primary">カメラ開始</button>
              <button id="stop" disabled>停止</button>
              <button id="capture" disabled>1回だけ読む</button>
              <label class="file">
                画像で試す
                <input id="file" type="file" accept="image/*" />
              </label>
            </div>
            <p id="status" class="status">まず「画像で試す」で /test-tag.png を投げると、検出APIだけを確認できます。</p>
          </div>
          <div class="result">
            <h2>検出結果</h2>
            <div id="result" class="status">まだ検出していません。</div>
          </div>
        </section>

        <section>
          <div class="pad">
            <h2>切り分けポイント</h2>
            <p class="status">
              画像アップロードで tag 0 が出るなら OpenCV 側は正常です。カメラだけ失敗する場合は、タグが小さい、ピントが合わない、明るさ不足、ブラウザ権限、または映像フレームが黒い可能性が高いです。
            </p>
            <canvas id="canvas" class="preview"></canvas>
            <pre id="debug">debug log</pre>
          </div>
        </section>
      </div>
    </main>

    <script>
      const video = document.getElementById('video')
      const canvas = document.getElementById('canvas')
      const startButton = document.getElementById('start')
      const stopButton = document.getElementById('stop')
      const captureButton = document.getElementById('capture')
      const fileInput = document.getElementById('file')
      const statusEl = document.getElementById('status')
      const resultEl = document.getElementById('result')
      const debugEl = document.getElementById('debug')

      let stream = null
      let timer = null
      let busy = false
      const logs = []

      function log(message, data) {
        const line = data ? `${message} ${JSON.stringify(data)}` : message
        logs.unshift(`${new Date().toLocaleTimeString()} ${line}`)
        debugEl.textContent = logs.slice(0, 30).join('\n')
      }

      async function startCamera() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },
            audio: false,
          })
          video.srcObject = stream
          await video.play()
          startButton.disabled = true
          stopButton.disabled = false
          captureButton.disabled = false
          statusEl.textContent = 'カメラ起動中。タグを白枠内に大きく入れてください。'
          log('camera started', {
            videoWidth: video.videoWidth,
            videoHeight: video.videoHeight,
            tracks: stream.getVideoTracks().map(track => track.label),
          })
          timer = window.setInterval(() => detectFromCamera('auto'), 1800)
          await detectFromCamera('first')
        } catch (error) {
          statusEl.textContent = `カメラ開始に失敗: ${error.message || error}`
          log('camera error', { error: String(error) })
        }
      }

      function stopCamera() {
        if (timer) window.clearInterval(timer)
        timer = null
        if (stream) stream.getTracks().forEach(track => track.stop())
        stream = null
        video.srcObject = null
        startButton.disabled = false
        stopButton.disabled = true
        captureButton.disabled = true
        statusEl.textContent = '停止しました。'
        log('camera stopped')
      }

      async function detectFromCamera(reason) {
        if (busy || !video.videoWidth || !video.videoHeight) return
        const width = Math.min(1280, video.videoWidth)
        const height = Math.round(width * video.videoHeight / video.videoWidth)
        canvas.width = width
        canvas.height = height
        const ctx = canvas.getContext('2d')
        ctx.drawImage(video, 0, 0, width, height)
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.92))
        if (!blob) return
        log('captured frame', { reason, width, height, bytes: blob.size })
        await detectBlob(blob, `camera-${Date.now()}.jpg`)
      }

      async function detectBlob(blob, filename) {
        busy = true
        captureButton.disabled = true
        statusEl.textContent = '読み取り中...'
        const started = performance.now()
        try {
          const form = new FormData()
          form.append('image', blob, filename)
          const res = await fetch('/api/detect', { method: 'POST', body: form })
          const text = await res.text()
          if (!res.ok) throw new Error(text)
          const data = JSON.parse(text)
          const ms = Math.round(performance.now() - started)
          log('detect response', { ms, raw_ids: data.diagnostics?.raw_ids, selected: data.diagnostics?.selected })
          renderResult(data)
        } catch (error) {
          statusEl.textContent = `検出エラー: ${error.message || error}`
          log('detect error', { error: String(error) })
        } finally {
          busy = false
          captureButton.disabled = !stream
        }
      }

      function renderResult(data) {
        if (!data.tags || data.tags.length === 0) {
          statusEl.textContent = 'タグなし。もっと近づく/明るくする/正面から写す、を試してください。'
          resultEl.textContent = `タグなし。試行辞書: ${(data.diagnostics?.tried || []).map(x => `${x.dict}=${x.count}`).join(' / ')}`
          return
        }
        statusEl.textContent = `認識: ${data.tags.map(tag => `tag ${tag.tag_id}`).join(', ')}`
        resultEl.innerHTML = data.tags.map(tag => `
          <div class="tag">
            <strong>tag ${tag.tag_id}</strong>
            <p>${tag.placement}</p>
            <p class="status">angle ${tag.angle_deg}° / ${tag.orientation_status}</p>
            <div class="quadrants">
              ${['top_left','top_right','bottom_left','bottom_right'].map(q => `
                <div><span>${q}</span>${tag.quadrants[q] || 'なし'}</div>
              `).join('')}
            </div>
          </div>
        `).join('')
      }

      startButton.addEventListener('click', startCamera)
      stopButton.addEventListener('click', stopCamera)
      captureButton.addEventListener('click', () => detectFromCamera('manual'))
      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0]
        if (file) detectBlob(file, file.name)
      })

      log('ready', {
        secureContext: window.isSecureContext,
        mediaDevices: Boolean(navigator.mediaDevices?.getUserMedia),
        userAgent: navigator.userAgent,
      })
    </script>
  </body>
</html>
