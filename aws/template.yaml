AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Booksearch (ホンノキ) backend on AWS — Lambdas + S3 + DynamoDB + SQS

Parameters:
  ProjectName:
    Type: String
    Default: booksearch
  GeminiModel:
    Type: String
    Default: gemini-3.1-flash-lite-preview
  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Gemini API key. Stored in Secrets Manager.
  AlarmEmail:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional email address for CloudWatch alarm and recovery notifications.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    MemorySize: 512
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        PROJECT_NAME: !Ref ProjectName
        BUCKET: !Ref AssetsBucket
        JOBS_TABLE: !Ref JobsTable
        SCAN_TASKS_TABLE: !Ref ScanTasksTable
        YOLO_QUEUE_URL: !Ref YoloQueue
        CROPS_TABLE: !Ref CropsTable
        CROP_FINGERPRINTS_TABLE: !Ref CropFingerprintsTable
        SHELF_OBSERVATIONS_TABLE: !Ref ShelfObservationsTable
        SHELF_CANDIDATES_TABLE: !Ref ShelfCandidatesTable
        OCR_QUEUE_URL: !Ref OcrQueue
        LOOKUP_QUEUE_URL: !Ref LookupQueue
        SECRET_GEMINI_ARN: !Ref GeminiSecret
        # Workers use these to recognize their last attempt and drop a single
        # frame/crop instead of stalling a live session. Keep them equal to the
        # matching queue's maxReceiveCount.
        YOLO_MAX_RECEIVE_COUNT: "2"
        OCR_MAX_RECEIVE_COUNT: "3"

Resources:

  # ---------- Storage ----------
  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${AWS::AccountId}-${AWS::Region}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 30
          - Id: ExpireCrops
            Status: Enabled
            Prefix: crops/
            ExpirationInDays: 30
          - Id: ExpireLiveFrames
            Status: Enabled
            Prefix: live/
            ExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']

  # ---------- DynamoDB ----------
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-jobs
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH

  ScanTasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-scan-tasks
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: task_id
          KeyType: RANGE

  CropsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-crops
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: crop_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: crop_id
          KeyType: RANGE

  CropFingerprintsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-crop-fingerprints
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fingerprint_scope
          AttributeType: S
      KeySchema:
        - AttributeName: fingerprint_scope
          KeyType: HASH

  ShelfObservationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-shelf-observations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: observation_id
          AttributeType: S
      KeySchema:
        - AttributeName: observation_id
          KeyType: HASH

  ShelfCandidatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${ProjectName}-shelf-candidates
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: book_id
          AttributeType: N
        - AttributeName: shelf_id
          AttributeType: S
      KeySchema:
        - AttributeName: book_id
          KeyType: HASH
        - AttributeName: shelf_id
          KeyType: RANGE

  # ---------- SQS ----------
  YoloDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-yolo-dlq
      MessageRetentionPeriod: 1209600

  YoloQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-yolo-queue
      VisibilityTimeout: 900
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt YoloDLQ.Arn
        maxReceiveCount: 2

  OcrDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-ocr-dlq
      MessageRetentionPeriod: 1209600

  OcrQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-ocr-queue
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OcrDLQ.Arn
        maxReceiveCount: 3

  LookupDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-lookup-dlq
      MessageRetentionPeriod: 1209600

  LookupQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-lookup-queue
      VisibilityTimeout: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LookupDLQ.Arn
        maxReceiveCount: 2

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      TopicName: !Sub ${ProjectName}-alarm-notifications

  AlarmTopicSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Endpoint: !Ref AlarmEmail
      Protocol: email
      TopicArn: !Ref AlarmTopic

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasAlarmEmail
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                # Keep this policy limited to the six alarms below. Do not add
                # an explicit Alarm -> AlarmTopicPolicy DependsOn: it would
                # introduce a dependency cycle through AlarmTopic.
                AWS:SourceArn:
                  - !GetAtt YoloQueueAgeAlarm.Arn
                  - !GetAtt OcrQueueAgeAlarm.Arn
                  - !GetAtt LookupQueueAgeAlarm.Arn
                  - !GetAtt YoloDLQAlarm.Arn
                  - !GetAtt OcrDLQAlarm.Arn
                  - !GetAtt LookupDLQAlarm.Arn

  YoloQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: YOLO queue oldest message remains above 15 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt YoloQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  OcrQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: OCR queue oldest message remains above 10 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OcrQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  LookupQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: lookup queue oldest message remains above 10 minutes
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LookupQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 600
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  YoloDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: YOLO DLQ contains messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt YoloDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  OcrDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: OCR DLQ contains messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt OcrDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  LookupDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: lookup DLQ contains messages
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LookupDLQ.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

  # ---------- Secrets ----------
  GeminiSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/gemini-api-key
      SecretString: !Sub '{"GEMINI_API_KEY":"${GeminiApiKey}"}'

  # ---------- HTTP API (API Gateway v2) ----------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['*']
        AllowMethods: [GET, POST, OPTIONS]

  # ---------- Lambdas ----------
  ApiFunction:
    Type: AWS::Serverless::Function
    # New task-producing API code must follow compatible workers during updates.
    DependsOn: [YoloFunction, OcrFunction, LookupFunction, LookupDispatcherFunction]
    Properties:
      FunctionName: !Sub ${ProjectName}-api
      CodeUri: functions/go_api/
      Handler: bootstrap
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          YOLO_QUEUE_URL: !Ref YoloQueue
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ScanTasksTable }
        - S3CrudPolicy: { BucketName: !Ref AssetsBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CropsTable }
        - DynamoDBReadPolicy: { TableName: !Ref ShelfCandidatesTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt YoloQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt LookupQueue.QueueName }
      Events:
        WeeklyFeatured:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 ? * MON *)
            Input: '{"source":"booksearch.featured.refresh"}'
            Enabled: true
        AnyRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /{proxy+}
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: ANY
            Path: /

    Metadata:
      BuildMethod: makefile

  YoloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-yolo
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 3008
      Timeout: 600
      EphemeralStorage: { Size: 2048 }
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ScanTasksTable }
        - S3CrudPolicy: { BucketName: !Ref AssetsBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CropsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CropFingerprintsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OcrQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt LookupQueue.QueueName }
      Events:
        FromYoloQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt YoloQueue.Arn
            BatchSize: 1
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/yolo_worker
      DockerTag: latest

  OcrFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-ocr
      CodeUri: functions/ocr_worker/
      Handler: handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          GEMINI_MODEL: !Ref GeminiModel
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ScanTasksTable }
        - S3CrudPolicy: { BucketName: !Ref AssetsBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CropsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CropFingerprintsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt LookupQueue.QueueName }
        - Statement:
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref GeminiSecret
      Events:
        FromOcrQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OcrQueue.Arn
            BatchSize: 1

  LookupDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-lookup-dispatcher
      CodeUri: functions/lookup_dispatcher/
      Handler: handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      Policies:
        - S3ReadPolicy: { BucketName: !Ref AssetsBucket }
        - DynamoDBReadPolicy: { TableName: !Ref ScanTasksTable }
        - DynamoDBReadPolicy: { TableName: !Ref CropsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt YoloQueue.QueueName }
        - SQSSendMessagePolicy: { QueueName: !GetAtt OcrQueue.QueueName }
        - DynamoDBReadPolicy: { TableName: !Ref JobsTable }
        - Statement:
            Effect: Allow
            Action: dynamodb:UpdateItem
            Resource: !GetAtt JobsTable.Arn
        - SQSSendMessagePolicy: { QueueName: !GetAtt LookupQueue.QueueName }
      Events:
        FromScanTasksStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ScanTasksTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
        FromJobsStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt JobsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures
        ReconcilePendingOutbox:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true

  LookupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-lookup
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 120
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ScanTasksTable }
        - S3CrudPolicy: { BucketName: !Ref AssetsBucket }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - DynamoDBReadPolicy: { TableName: !Ref CropsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ShelfObservationsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ShelfCandidatesTable }
      Events:
        FromLookupQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt LookupQueue.Arn
            BatchSize: 1
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./functions/lookup_worker
      DockerTag: latest

Outputs:
  ApiEndpoint:
    Description: HTTP API endpoint
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  BucketName:
    Value: !Ref AssetsBucket
  JobsTable:
    Value: !Ref JobsTable
  CropsTable:
    Value: !Ref CropsTable
  CropFingerprintsTable:
    Value: !Ref CropFingerprintsTable
  YoloQueueUrl:
    Value: !Ref YoloQueue
  OcrQueueUrl:
    Value: !Ref OcrQueue
  LookupQueueUrl:
    Value: !Ref LookupQueue
