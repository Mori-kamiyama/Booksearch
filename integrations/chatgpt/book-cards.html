<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ホンノキの本</title>
<style>
:root{color-scheme:light dark;font-family:var(--font-sans,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);--text:light-dark(#171717,#f3f3f3);--muted:light-dark(#686868,#aaa);--line:light-dark(#e5e5e5,#363636);--surface:light-dark(#f7f7f7,#242424);color:var(--text);background:transparent;font-size:14px}
*{box-sizing:border-box}body{margin:0;padding:4px}#books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}article{min-width:0;display:flex;flex-direction:column}article:only-child{max-width:440px}.cover{height:186px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:16px}.cover img{max-width:100%;height:154px;object-fit:contain;filter:drop-shadow(0 3px 4px #0002)}.missing{font-size:12px;color:var(--muted)}.body{padding:12px 2px 0;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}h2{font-size:15px;font-weight:600;line-height:1.45;margin:0;overflow-wrap:anywhere}p{margin:0;font-size:13px;line-height:1.55;overflow-wrap:anywhere}.meta{color:var(--muted)}.pages{font-size:12px;color:var(--muted)}a{color:inherit}.open{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 12px;margin-top:5px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:500;text-decoration:none;background:transparent}.open{background:#087f5b;border-color:#087f5b;color:#fff}.open:hover{background:#076b4d;border-color:#076b4d}.reason{font-size:13px;line-height:1.65;margin:5px 0}.reason-label{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.open:focus-visible,summary:focus-visible{outline:2px solid var(--text);outline-offset:3px}details{font-size:13px;margin-top:4px}summary{cursor:pointer;color:var(--muted);min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}summary::-webkit-details-marker{display:none}summary::after{content:'⌄';font-size:15px}details[open] summary::after{content:'⌃'}details p{padding:4px 0 8px;line-height:1.7}#status{font-size:13px;color:var(--muted);line-height:1.5}#status:empty{display:none}@media(max-width:420px){#books{grid-template-columns:1fr;gap:0}article,article:only-child{max-width:none;display:grid;grid-template-columns:82px minmax(0,1fr);gap:16px;padding:16px 0}article+article{border-top:1px solid var(--line)}article:first-child{padding-top:0}article:last-child{padding-bottom:0}.cover{height:116px;padding:8px;border-radius:8px}.cover img{height:auto;max-height:100%;max-width:100%}.body{padding:0}h2{font-size:15px}.open{margin-top:2px}details{margin-top:0}}
</style></head><body><p id="status" role="status">本の情報を読み込んでいます…</p><main id="books" aria-label="蔵書の候補"></main>
<script>
const siteOrigin=__SITE_ORIGIN__;
const root=document.querySelector('#books');let nextId=0;const pending=new Map();let connected=false;
const notify=(method,params)=>parent.postMessage({jsonrpc:'2.0',method,params},'*');
function request(method,params){return new Promise((resolve,reject)=>{const id=++nextId;const timer=setTimeout(()=>{pending.delete(id);reject(new Error('timeout'))},10000);pending.set(id,{resolve,reject,timer});parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function element(tag,text,cls){const el=document.createElement(tag);if(text)el.textContent=text;if(cls)el.className=cls;return el}
function url(value,origin){try{const u=new URL(value);return u.protocol==='https:' && !u.username && !u.password && (!origin||u.origin===origin)?u.href:null}catch{return null}}
function render(data){if(!Array.isArray(data?.books))return;root.replaceChildren();document.querySelector('#status').textContent=data.books.length?'':'本が見つかりませんでした。';
for(const book of data.books){const card=element('article');const cover=element('div',null,'cover');const imageUrl=url(book.thumbnail);const missing=()=>cover.replaceChildren(element('span','書影なし','missing'));
if(imageUrl){const img=element('img');img.src=imageUrl;img.alt=`${book.title}の書影`;img.referrerPolicy='no-referrer';img.addEventListener('error',missing,{once:true});cover.append(img)}else missing();
const body=element('div',null,'body');body.append(element('h2',book.title),element('p',book.authors||'著者情報なし','meta'));if(book.page_count)body.append(element('p',`${book.page_count}ページ`,'pages'));
if(book.recommendation_reason){const reason=element('p',null,'reason');reason.append(element('span','おすすめ理由','reason-label'),document.createTextNode(book.recommendation_reason));body.append(reason)}
if(book.description){const details=element('details');details.append(element('summary',book.description.length>240?'内容を見る（抜粋）':'内容を見る'),element('p',book.description.length>240?book.description.slice(0,240)+'…':book.description));body.append(details)}
const target=url(book.url,siteOrigin);if(target){const link=element('a','本の場所を知る','open');const arrow=element('span','↗');arrow.setAttribute('aria-hidden','true');link.append(arrow);link.setAttribute('aria-label',`${book.title}の場所をホンノキで確認`);link.href=target;link.target='_blank';link.rel='noopener noreferrer';link.addEventListener('click',async e=>{if(!connected)return;e.preventDefault();try{await request('ui/open-link',{url:target})}catch{document.querySelector('#status').textContent='リンクを開けませんでした。もう一度お試しください。';connected=false}});body.insertBefore(link,body.querySelector('h2').nextSibling)}card.append(cover,body);root.append(card)}notify('ui/notifications/size-changed',{height:Math.ceil(document.body.getBoundingClientRect().height)+1})}
window.addEventListener('message',e=>{if(e.source!==parent||e.data?.jsonrpc!=='2.0')return;const m=e.data;if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(m.error):p.resolve(m.result)}else if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent)});
request('ui/initialize',{appInfo:{name:'honno-ki-books',version:'1.0.0'},appCapabilities:{},protocolVersion:'2026-01-26'}).then(()=>{connected=true;notify('ui/notifications/initialized',{})}).catch(()=>{document.querySelector('#status').textContent='カードを読み込めませんでした。本文の詳細リンクをご利用ください。'});
new ResizeObserver(()=>{if(connected)notify('ui/notifications/size-changed',{height:Math.ceil(document.body.getBoundingClientRect().height)+1})}).observe(document.body);
</script></body></html>
