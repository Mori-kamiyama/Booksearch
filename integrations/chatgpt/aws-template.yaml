AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only HonnoKi MCP on Lambda and HTTP API
Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  CatalogApiUrl:
    Type: String
    Default: https://rx7ylpbzg6.execute-api.ap-northeast-1.amazonaws.com
Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/booksearch-mcp
      RetentionInDays: 14
  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: booksearch-mcp
      Runtime: python3.12
      Architectures: [x86_64]
      Handler: lambda_handler.handler
      Role: !GetAtt Role.Arn
      MemorySize: 512
      Timeout: 25
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          CATALOG_API_URL: !Ref CatalogApiUrl
          SITE_URL: https://d2uel8nex1m4w7.cloudfront.net
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: booksearch-mcp
      ProtocolType: HTTP
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 29000
  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /mcp
      Target: !Sub integrations/${Integration}
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
  Permission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/mcp
  Errors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: MCP Lambda failures (notification destination remains deferred)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  McpUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/mcp
