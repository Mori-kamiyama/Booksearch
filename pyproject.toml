[project]
name = "booksearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.73.1",
  "openai>=1.0.0",
  "opencv-python>=4.13.0.92",
  "pillow>=10.4.0,<11.0.0",
  "openpyxl>=3.1.5",
  "ultralytics>=8.4.47",
  "torch>=2.10.0",
  "transformers>=5.5.4",
  "huggingface-hub>=1.11.0",
  "sentencepiece>=0.2.1",
  "accelerate>=1.13.0",
  "safetensors>=0.7.0"
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "api.tags.detect:handler"
